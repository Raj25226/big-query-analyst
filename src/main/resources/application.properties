# ── Server ─────────────────────────────────────────────────────────────────
server.port=8000
spring.application.name=big-query-analyst

# ── Looker API Configuration ────────────────────────────────────────────────
# Required: The base URL of your Looker instance (e.g., https://your-instance.looker.com:19999)
looker.base.url=${LOOKER_BASE_URL:https://example.looker.com}
looker.client.id=${LOOKER_CLIENT_ID:your_client_id}
looker.client.secret=${LOOKER_CLIENT_SECRET:your_client_secret}
